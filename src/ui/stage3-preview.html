<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр экранов Stage 3</title>
    <style>
      body { margin: 0; }
      .preview {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .5rem;
        padding: .5rem .75rem;
        background: #192424;
        color: #f7f1e6;
        font: .875rem/1.4 system-ui, sans-serif;
      }
      .preview select { min-height: 44px; max-width: 100%; font: inherit; }
      .preview :focus-visible { outline: 2px solid #ffc76b; outline-offset: 2px; }
      .preview p { margin: 0; flex-basis: 100%; overflow-wrap: anywhere; }
      .preview p:empty { display: none; }
    </style>
  </head>
  <body>
    <aside class="preview" aria-label="Управление просмотром">
      <label for="example">Пример Stage 3</label>
      <select id="example"></select>
      <label for="baggage-outcome">Сценарий чемодана</label>
      <select id="baggage-outcome">
        <option value="low">Дешёвая находка</option>
        <option value="high">Дорогая находка</option>
      </select>
      <p>Кнопки переключают готовые снимки. Суммы и рейтинг заданы в примерах.</p>
      <p id="preview-message" role="status"></p>
    </aside>
    <main id="app"></main>
    <script type="module" src="./stage3-preview.ts"></script>
  </body>
</html>
